<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gition</title>
    <script>
      // SPA fallback for GitHub Pages. The deploy base path is injected at
      // build time (see vite.config.ts) via the replace404Base plugin.
      (function () {
        var basePath = '__GITION_BASE__'
        if (!location.pathname.startsWith(basePath)) {
          location.replace(basePath)
          return
        }
        var rest = location.pathname.slice(basePath.length)
        var qs =
          (rest ? '?p=' + encodeURIComponent('/' + rest) : '') +
          (location.search
            ? (rest ? '&' : '?') + location.search.slice(1)
            : '')
        location.replace(basePath + qs + location.hash)
      })()
    </script>
  </head>
  <body></body>
</html>
